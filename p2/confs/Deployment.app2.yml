apiVersion: apps/v1
kind: Deployment

metadata: # organizational data
  name: app2
  labels:
    app: app2
spec:
  replicas: 3
  selector:
    matchLabels: # to match with template data : tells deployment which pods belong to it, like a detector
      app: app2
  template: # stamps the each pod from this deployment with this tag
    metadata:
      labels:
        app: app2 # that one
    spec:
      containers:
        - name: app2
          image: hashicorp/http-echo:latest
          args:
          - "-text=Greetings from App 2!"
          ports:
            - containerPort: 5678 # port the process inside the container is listening on
              protocol: TCP