apiVersion: v1
kind: Service
metadata:
  name: app1-clusterip
  labels:
    foo: app1-service
  annotations:
    bar: app1-service
spec:
  type: ClusterIP # This is the default value
  selector:
    app: app1
  ports:
    - protocol: TCP
      port: 80 # Port the service is listening on
      targetPort: 80 # Port the container is listening on