apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress
spec:
  ingressClassName: traefik
  rules:
    - host: "app1.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app1-clusterip
                port:
                  number: 80