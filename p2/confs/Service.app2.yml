apiVersion: v1
kind: Service
metadata:
  name: app2-clusterip
  labels:
    foo: app2-service
  annotations:
    bar: app2-service
spec:
  type: ClusterIP # This is the default value
  selector:
    app: app2
  ports:
    - protocol: TCP
      port: 80 # Port the service is listening on
      targetPort: 5678 # Port the container is listening on