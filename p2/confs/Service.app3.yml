apiVersion: v1
kind: Service
metadata:
  name: app3-clusterip
  labels:
    foo: app3-service
  annotations:
    bar: app3-service
spec:
  type: ClusterIP # This is the default value
  selector:
    app: app3
  ports:
    - protocol: TCP
      port: 80 # Port the service is listening on
      targetPort: 5678 # Port the container is listening on